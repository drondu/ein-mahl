<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game - Waiting Area</title>
    <link rel="stylesheet" href="/waiting_room/styles.css">
</head>
<body>
    <div class="page-layout">
        <div class="sidebar">
            <div class="profile-card">
                <a href="/profile/profile.html" style="text-decoration: none; color: inherit;">
                    <div class="profile-avatar" id="profileAvatar">
                        <!-- Avatar image or initials will be set by JS -->
                    </div>
                </a>
                <h2 id="profileUsername"></h2>
                <div class="profile-stats">
                    <div class="stat-box">
                        <div>Games</div>
                        <div id="gamesPlayed">0</div>
                    </div>
                    <div class="stat-box">
                        <div>Wins</div>
                        <div id="gamesWon">0</div>
                    </div>
                </div>
                <div class="profile-buttons" style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="logout-btn" onclick="logout()">Logout</button>
                    <a href="/profile/profile.html" class="button-primary" style="text-align: center; text-decoration: none;">View Profile</a>
                    <div id="adminButton" style="display: none;">
                        <a href="/admin/admin.html" class="button-primary" style="display: block; text-decoration: none;">Admin Dashboard</a>
                    </div>
                </div>
            </div>

            <div class="top-players-card">
                <h2>Top Players</h2>
                <ul class="top-players-list">
                    <!-- Top players will be loaded here via JS -->
                </ul>
            </div>

            <div class="chat-box">
                <h2>Global Chat</h2>
                <div class="chat-messages" id="globalChat">
                    <!-- Chat messages will be loaded here -->
                </div>
                <div class="chat-input">
                    <input 
                        type="text" 
                        id="globalMessageInput" 
                        placeholder="Type a message..." 
                        onkeypress="if(event.key === 'Enter') sendGlobalMessage()"
                    />
                    <button onclick="sendGlobalMessage()">Send</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="games-header">
                <h2>Active Games</h2>
                <button class="button-primary" onclick="openCreateGameModal()">Create Game</button>
            </div>

            <div class="games-grid" id="gamesList">
                <!-- Games will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Delete Game Modal -->
    <div id="deleteGameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="color: #ff4444;">Delete Game</h2>
                <button class="close-modal" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div style="padding: 20px; color: #333;">
                <p style="font-weight: bold; color: #ff4444;">⚠️ Warning: This action cannot be undone!</p>
                <p>Are you absolutely sure you want to delete this game?</p>
                <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
                    <button class="button-primary" onclick="closeDeleteModal()">Cancel</button>
                    <button class="button-delete" id="confirmDeleteButton">Yes, Delete Game</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Game Modal -->
    <div id="createGameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Game</h2>
                <button class="close-modal" onclick="closeCreateGameModal()">&times;</button>
            </div>
            <form id="createGameForm" class="modal-form">
                <input type="text" id="gameName" placeholder="Game Name" required>
                <select id="maxPlayers">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4">4 Players</option>
                </select>
                <button type="submit">Create Game</button>
            </form>
        </div>
    </div>

    <script type="module">
        import {
            initializeApp,
            openCreateGameModal, closeCreateGameModal, handleCreateGame,
            openDeleteModal, closeDeleteModal, deleteGame,
            joinGame, spectateGame, logout,
            sendGlobalMessage,
            getGameToDelete // Add this import
        } from './script.js';

        // Make functions available globally for inline event handlers
        Object.assign(window, {
            openCreateGameModal,
            closeCreateGameModal,
            handleCreateGame,
            openDeleteModal,
            closeDeleteModal,
            deleteGame,
            joinGame,
            spectateGame,
            logout,
            sendGlobalMessage
        });

        // Set up initial event listeners
        function setupEventListeners() {
            // Create game form
            const createGameForm = document.getElementById('createGameForm');
            createGameForm.addEventListener('submit', (e) => {
                e.preventDefault();
                handleCreateGame(e);
            });

            // Delete game confirmation
            const confirmDeleteButton = document.getElementById('confirmDeleteButton');
            confirmDeleteButton.addEventListener('click', async () => {
                const gameId = getGameToDelete();
                if (gameId) {
                    await deleteGame(gameId);
                    closeDeleteModal();
                }
            });

            // Modal background clicks
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (event) => {
                    if (event.target === modal) {
                        if (modal.id === 'createGameModal') {
                            closeCreateGameModal();
                        } else if (modal.id === 'deleteGameModal') {
                            closeDeleteModal();
                        }
                    }
                });
            });

            // ESC key to close modals
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeCreateGameModal();
                    closeDeleteModal();
                }
            });
        }

        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            initializeApp();
        });
    </script>
</body>
</html>
